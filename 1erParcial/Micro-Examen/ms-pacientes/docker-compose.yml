services:
  app:
    build: .
    container_name: ms_pacientes
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    networks:
      - my_network

  mysql:
    image: mysql:latest
    container_name: mysql_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=123
      - MYSQL_DATABASE=bd_paciente
      
    ports:
      - "3306:3306"
    networks:
      - my_network
    volumes:
      - mysql_data:/var/lib/mysql

networks:
  my_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
     