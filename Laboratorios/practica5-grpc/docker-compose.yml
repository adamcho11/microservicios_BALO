services:
  estudiantes:
    build: .
  # sin sección ports: no se expone fuera de la red de Docker
  usuarios:
    build: ../practica3-rest
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: practica3
      GRPC_ADDR: estudiantes:50051
    depends_on:
      - estudiantes
      - mongo
  mongo:
    image: mongo:7
    volumes:
      - datos:/data/db

volumes:
  datos: